name: Run g2ray Installation

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Avoid Node.js 20 deprecation warnings

jobs:
  install-and-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No "npm install" step needed because package.json has no dependencies

      - name: Run installation script with logging
        run: npm start

      - name: Upload log file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: g2ray-installation-log
          path: log/log.log
          if-no-files-found: warn
